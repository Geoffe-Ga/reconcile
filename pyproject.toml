# pyproject.toml - Python project configuration

[project]
name = "reconcile"
version = "0.1.0"
description = "A quality-controlled Python project"
readme = "README.md"
requires-python = ">=3.11"
# No license until publication (ADR-0024): the repo stays private and unlicensed.
# Runtime dependencies live in requirements.txt, pinned exactly, read below.
dynamic = ["dependencies"]
authors = [
    { name = "Generated by SGSG" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "bandit>=1.7.5",
    "pip-audit>=2.7.0",
    "radon>=6.0.0",
    "mutmut>=2.4.0,<3.0.0",
    "pre-commit>=3.4.0",
    "PyYAML>=6.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reconcile*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov",  # measures [tool.coverage.run] source
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: crosses a process or network boundary (excluded from --unit)",
    "e2e: drives the full client-relay loop (excluded from --unit)",
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# The one list of what the coverage gate measures (#55). The gate scripts read it
# through a bare --cov; tests/test_coverage_scope.py keeps it that way.
source = ["reconcile", "scripts"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/virtualenv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "if __name__ == .__main__.",
    "pragma: no cover",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true
# One file set for local, pre-commit, and CI runs (scripts/typecheck.sh).
files = ["reconcile", "tests", "scripts", ".claude/skills/decide/scripts"]
explicit_package_bases = true
# Typed stubs for py-vapid, which ships none (#89): no ignore_missing_imports.
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
extend-exclude = ["client", "*.md"]  # Markdown code samples include deliberate before-examples
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # Ruff-specific rules
    "TRY",    # tryceratops (exception handling)
    "FURB",   # refurb (modernization)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]  # Allow assert in tests

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "client", "mutants", "build", "dist"]
skips = ["B101"]  # Skip assert_used in tests

[tool.mutmut]
paths_to_mutate = "reconcile/,scripts/"  # = [tool.coverage.run] source
backup = false
runner = "python -m pytest --exitfirst --quiet --tb=no"
tests_dir = "tests/"

[tool.interrogate]
# Docstring coverage (CLAUDE.md: >= 95%). scripts/lint.sh runs this; so does CI.
fail-under = 95
exclude = [".venv", "client", "mutants", "build", "dist", "node_modules"]
ignore-init-module = false
verbose = 1

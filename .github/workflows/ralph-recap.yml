name: Ralph Recap

# Posts a recap of the merge loop to Discord every time a pull request merges.
# Merge metadata only: PR number, title, link, counts, and durations. No PR
# bodies, diffs, or file contents, and no AI calls (see scripts/ralph/RECAP.md).
#
# Configuration:
#   DISCORD_BOT_TOKEN  bot token with Send Messages on the channel. Read from
#                      `secrets` only: Actions doesn't mask variables in logs
#                      (tests/test_workflows.py enforces this).
#   RALPH_CHANNEL_ID   target Discord channel ID (all digits). It isn't secret,
#                      so a same-named `vars` entry works too; `secrets` wins.
#
# Until both exist, the job exits 0 with a notice, so it never reddens CI.
# The built-in GITHUB_TOKEN reads the merge history (read-only).
#
# Trust: the last step runs the merged PR's own scripts/ralph/ code with
# DISCORD_BOT_TOKEN in its environment. The code that sees it is listed in
# RECAP.md, "Secrets and trust"; keep that list current when this step changes.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  recap:
    name: Post merge recap
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5  # slowest successful run: 0.2 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Post Ralph Recap to Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          RALPH_CHANNEL_ID: ${{ secrets.RALPH_CHANNEL_ID || vars.RALPH_CHANNEL_ID }}
        run: python -m scripts.ralph.recap --skip-if-unconfigured

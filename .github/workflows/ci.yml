name: CI

# Every job here is a thin wrapper around the same scripts developers run
# locally, with the same pinned tools (requirements-dev.txt, client lockfile,
# client/.nvmrc). Rules live in pyproject.toml, client config, and scripts/,
# never in this file, so CI and a laptop can't disagree.
#
# Every job sets timeout-minutes: about twice its slowest successful run
# (measured over November 2026's runs), rounded up to 5 minutes, so a hung job
# costs that, not GitHub's six-hour default. tests/test_workflows.py holds every
# workflow to it. Playwright's and Vitest's own timeouts are unchanged.

# No push trigger: a merge to main starts no run (ADR-0061, amended
# 2026-11-12). A PR's own CI tests what lands, and each PR is merged with
# current main and checked locally before it merges. This nightly full run is
# the backstop for skew between merges. tests/test_ci_triggers.py holds it.
on:
  pull_request:
    branches: [main]
  # 14:17 UTC (06:17 Pacific). In the week before this, no merge landed
  # between 14:00 and 16:00 UTC, so it checks the overnight merges on a
  # settled main, well clear of graph-build.yml's 04:40 run. Not :00 or :30,
  # where GitHub delays and, under load, drops scheduled runs.
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

# One run per event and ref, so a PR's newer push cancels its older run. A
# nightly run and a dispatch both run on refs/heads/main; the event keeps
# them apart, so neither cancels the other: not a dispatched mutation run hours
# in, and not the nightly backstop.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5  # slowest successful run: 0.4 min
    outputs:
      python: ${{ steps.areas.outputs.python }}
      client: ${{ steps.areas.outputs.client }}
      deploy: ${{ steps.areas.outputs.deploy }}
      e2e: ${{ steps.areas.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths (scripts/changed-areas.sh)
        id: areas
        env:
          # Only a PR has a base to diff against. A nightly or manual run on
          # main has none (the router would diff main against itself and check
          # nothing), so it checks every area; an empty base does too.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          FORCE_ALL: ${{ github.event_name != 'pull_request' }}
        run: |
          if [[ "$FORCE_ALL" == "true" || -z "$BASE_REF" ]]; then
            ./scripts/changed-areas.sh --all | tee -a "$GITHUB_OUTPUT"
          else
            ./scripts/changed-areas.sh | tee -a "$GITHUB_OUTPUT"
          fi

  python:
    name: Python gate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5  # slowest successful run: 1.8 min
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pinned tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: ./scripts/check-all.sh --python
        run: ./scripts/check-all.sh --python

  client:
    name: Client gate
    runs-on: ubuntu-latest
    timeout-minutes: 50  # slowest successful run: 23.1 min
    needs: changes
    if: needs.changes.outputs.client == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install locked dependencies
        working-directory: client
        run: npm ci

      - name: ./scripts/check-all.sh --client
        run: ./scripts/check-all.sh --client

  deploy:
    name: Deploy config gate
    runs-on: ubuntu-latest
    timeout-minutes: 10  # slowest successful run: 3.4 min
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's own package, as on a laptop; nothing fetched from elsewhere.
      # The package starts a caddy service; this job needs only the binary.
      - name: Install Caddy (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y caddy
          sudo systemctl disable --now caddy

      - name: ./scripts/check-all.sh --deploy
        run: ./scripts/check-all.sh --deploy

  e2e:
    name: End-to-end loop (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 55  # slowest successful run: 26.6 min
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    # Playwright's own image for the locked version (tests/test_ci_e2e_image.py
    # holds the tag to client/package-lock.json). It already has Chromium,
    # WebKit and their system packages, so no step fetches from Ubuntu's apt
    # mirror, which stalled `playwright install --with-deps` for 26, 46 and 96
    # minutes, and twice in a row on 2026-11-18. `resolute` is ubuntu-latest's
    # own Ubuntu, which WebKit is built for.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute
    steps:
      - uses: actions/checkout@v4

      # The relay runs as on a laptop: ./scripts/relay.sh, runtime deps only.
      # No pip cache: setup-python keys it with lsb_release, which the image
      # lacks, and the relay's install takes seconds.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the relay
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -e .

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install locked dependencies
        working-directory: client
        run: npm ci

      - name: ./scripts/check-all.sh --e2e
        run: ./scripts/check-all.sh --e2e

      # Test data only: each failed test's trace, for debugging.
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: client/test-results/
          retention-days: 7

  pre-commit:
    name: Pre-commit hooks (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 5  # slowest successful run: 1.5 min
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install pinned tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          npm ci --prefix client

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit on changed files
        env:
          # The branch guard protects local commits; a nightly or manual run checks out main.
          SKIP: no-commit-to-branch
          # As in "changes": only a PR diffs against a base; other runs check every file.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          FULL: ${{ github.event_name != 'pull_request' }}
        run: ./scripts/precommit-changed.sh --show-diff-on-failure

  gate:
    name: CI gate
    # The one check branch protection requires. Area jobs skip when their area
    # didn't change; this fails only if a job that ran failed or was cancelled.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, python, client, deploy, e2e, pre-commit]
    if: always()
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A required job ended: $r"; exit 1 ;; esac
          done

  mutation:
    name: Mutation testing (manual, before a release)
    # Recommended before a release, not a merge gate (ADR-0061).
    # Run from the Actions tab: "Run workflow" on main. Never nightly.
    runs-on: ubuntu-latest
    timeout-minutes: 360  # no run measured yet: the hosted-runner maximum, set on purpose
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Python (./scripts/mutation.sh)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          ./scripts/mutation.sh

      - name: Client (client/scripts/mutation.sh)
        run: |
          npm ci --prefix client
          cd client && ./scripts/mutation.sh

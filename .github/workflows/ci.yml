name: CI

# Every job here is a thin wrapper around the same scripts developers run
# locally, with the same pinned tools (requirements-dev.txt, client lockfile,
# client/.nvmrc). Rules live in pyproject.toml, client config, and scripts/,
# never in this file, so CI and a laptop can't disagree.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.areas.outputs.python }}
      client: ${{ steps.areas.outputs.client }}
      deploy: ${{ steps.areas.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths (scripts/changed-areas.sh)
        id: areas
        env:
          # PRs compare against their base; pushes compare against the previous commit.
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$FORCE_ALL" == "true" || "$BASE_REF" == "0000000000000000000000000000000000000000" ]]; then
            ./scripts/changed-areas.sh --all | tee -a "$GITHUB_OUTPUT"
          else
            ./scripts/changed-areas.sh | tee -a "$GITHUB_OUTPUT"
          fi

  python:
    name: Python gate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pinned tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: ./scripts/check-all.sh --python
        run: ./scripts/check-all.sh --python

  client:
    name: Client gate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.client == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install locked dependencies
        working-directory: client
        run: npm ci

      - name: ./scripts/check-all.sh --client
        run: ./scripts/check-all.sh --client

  deploy:
    name: Deploy config gate
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's own package, as on a laptop; nothing fetched from elsewhere.
      # The package starts a caddy service; this job needs only the binary.
      - name: Install Caddy (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y caddy
          sudo systemctl disable --now caddy

      - name: ./scripts/check-all.sh --deploy
        run: ./scripts/check-all.sh --deploy

  pre-commit:
    name: Pre-commit hooks (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install pinned tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          npm ci --prefix client

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit on changed files
        env:
          # The branch guard protects local commits; CI checks out main on push.
          SKIP: no-commit-to-branch
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: ./scripts/precommit-changed.sh --show-diff-on-failure

  gate:
    name: CI gate
    # The one check branch protection requires. Area jobs skip when their area
    # didn't change; this fails only if a job that ran failed or was cancelled.
    runs-on: ubuntu-latest
    needs: [changes, python, client, deploy, pre-commit]
    if: always()
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A required job ended: $r"; exit 1 ;; esac
          done

  mutation:
    name: Mutation testing (manual, before a release)
    # Recommended before a release, not a merge gate (ADR-0061).
    # Run from the Actions tab: "Run workflow" on main.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Python (./scripts/mutation.sh)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          ./scripts/mutation.sh

      - name: Client (client/scripts/mutation.sh)
        run: |
          npm ci --prefix client
          cd client && ./scripts/mutation.sh

# Pre-commit hooks for Reconcile
# Install: pre-commit install --install-hooks -t pre-commit -t commit-msg
# Run manually (with .venv active): ./scripts/precommit-changed.sh
# (changed files, exactly as CI does; it checks every file when this config changes)
#
# One set of rules everywhere: hooks that run a project tool are `local` hooks
# calling the exact versions pinned in requirements-dev.txt (Python) or
# client/package-lock.json (Prettier), with config from pyproject.toml and
# client/.prettierrc. CI runs this file too (the `pre-commit` job), alongside
# ./scripts/check-all.sh. Don't add a second copy of a tool here.

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-toml
  - id: check-json
    exclude: ^client/tsconfig.*\.json$  # tsconfig allows comments (JSONC)
  - id: check-added-large-files
    args: [--maxkb=500]
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-ast
  - id: debug-statements
  - id: check-docstring-first
  - id: detect-private-key
  - id: fix-byte-order-marker
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: no-commit-to-branch
    args: [--branch, main]

- repo: local
  hooks:
  - id: ruff-lint
    name: ruff (lint, pinned)
    entry: ruff check --fix
    language: system
    types_or: [python, pyi]
  - id: ruff-format
    name: ruff (format, pinned)
    entry: ruff format
    language: system
    types_or: [python, pyi]
  - id: mypy
    name: mypy (pinned; files from pyproject.toml)
    entry: mypy
    language: system
    pass_filenames: false
    types: [python]
  - id: interrogate
    name: interrogate (docstring coverage, pinned)
    entry: interrogate
    language: system
    pass_filenames: false
    types: [python]
  - id: prettier
    name: prettier (client's pinned version)
    # Run from client/ so client/.prettierrc and client/.prettierignore apply,
    # exactly as in the client's own format check.
    entry: bash -c 'cd client && files=(); for f in "$@"; do files+=("${f#client/}"); done; node_modules/.bin/prettier --write --ignore-unknown "${files[@]}"' --
    language: system
    files: ^client/
    types_or: [ts, tsx, javascript, json, css, html]

- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck

- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args: [--baseline, .secrets.baseline]

- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.3.0
  hooks:
  - id: conventional-pre-commit
    stages: [commit-msg]

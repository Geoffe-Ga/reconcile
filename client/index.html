<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15140f" media="(prefers-color-scheme: dark)" />
    <!--
      React Aria injects an inline <style> with this id unless the id is taken,
      and the CSP blocks inline styles. This claims it; src/styles/pressable.css
      ships the same rule (#150).
      Only id is load-bearing: React Aria looks the element up by id alone.
      name and content are set because a valid <meta> needs a name and a
      content; content names the stylesheet that ships the rule, and
      src/styles/pressable.test.tsx fails if it stops naming that file.
    -->
    <meta
      id="react-aria-pressable-style"
      name="react-aria-pressable-style"
      content="src/styles/pressable.css"
    />
    <title>Reconcile</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
